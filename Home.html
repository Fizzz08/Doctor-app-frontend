<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home page</title>
    <link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="js/auth.js"></script>
    <link rel="stylesheet" href="css/home.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Montserrat&family=Poppins&display=swap" rel="stylesheet">
</head>
<body>
<!-- Header -->
<header class="app-header">
    <div class="brand" data-testid="brand-logo">
        <div class="brand-mark" aria-hidden="true">M+</div>
        <div class="brand-name">Medi<span>Book</span></div>
    </div>

    <div class="profile-dropdown">
        <div class="contain">
            <img src="image/profile.jpg" alt="Profile Image" class="profile-img" id="profileImg">
            <span class="welcome-message">Welcome, User</span>
        </div>
        <div class="dropdown-content" id="dropdownMenu">
            <div class="dropdown-header">
                <img src="image/profile.jpg" alt="Profile Image" class="dropdown-profile-img">
                <span class="welcome-message" style="color:black">Welcome, User</span>
            </div>
            <a href="profile.html">Profile</a>
            <a href="Home.html" class="active">Home</a>
            <a href="recentAppointment.html">Recent Appointments</a>
            <a href="#settings">Settings</a>
            <a href="#" id="logoutButton">Logout</a>
        </div>
    </div>
</header>

<main>
<div class="appointment-container">

    <h1 class="title">Find and Book</h1>

    <!-- ✅ ADD FORM BACK -->
    <form id="appointmentForm">

        <div class="search-container">

            <div class="location-box">
                <select id="location" aria-label="Select Location">
                    <option value="">📍 Select Location</option>
                    <option>MG Road</option>
                    <option>Indiranagar</option>
                    <option>Koramangala</option>
                    <option>Whitefield</option>
                    <option>Jayanagar</option>
                    <option>HSR Layout</option>
                    <option>Electronic City</option>
                    <option>Hebbal</option>
                    <option>Yeshwanthpur</option>
                    <option>Rajajinagar</option>
                </select>
            </div>

            <div class="search-wrapper">
                <input 
                    id="specialization"
                    type="text"
                    placeholder="Search doctors, clinics, specialties..."
                    autocomplete="off"
                />

                <div id="suggestionBox" class="suggestion-box hidden">
                    <div class="section-title">Popular Searches</div>
                    <div id="popularContainer" class="popular-container"></div>

                    <div class="section-title">Common Specialities</div>
                    <div id="specialityList"></div>
                </div>
            </div>

        </div>
        <button type="submit" class="btn">Search</button>

    </form>

</div>
</main>

<script src="js/config.js"></script>
<script type="module" src="js/homeValidate.js"></script>

</body>
<!-- Footer -->
    <footer class="app-footer">
        <p>&copy; 2024 MediBook App. All rights reserved.</p>
        <p>Contact us: support@medibook.com | Phone: +91 12-345-6789</p>
    </footer>
</html>
